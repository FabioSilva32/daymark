<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Daymark</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .logo {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(229, 9, 20, 0.3);
    }
    h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 2px;
      margin: 0 0 8px 0;
    }
    p {
      font-size: 13px;
      color: #777777;
      margin: 0 0 24px 0;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #222222;
      border-top-color: #E50914;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <img src="icon.svg" alt="Daymark" class="logo" />
  <h1>DAYMARK</h1>
  <p>Connecting to Command Centre...</p>
  <div class="spinner"></div>

  <script>
    // Configurable host: when running natively, attempt to connect to server URL or local address
    const targetUrl = window.DAYMARK_SERVER_URL || 'http://192.168.1.91:3001';
    setTimeout(() => {
      window.location.href = targetUrl;
    }, 500);
  </script>
</body>
</html>
